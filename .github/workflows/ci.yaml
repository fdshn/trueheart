name: CI

on:
  pull_request:
  push:
    # Repo hiện ở nhánh `master`; khai cả `main` để không phải sửa workflow
    # nếu sau này đổi tên nhánh chính.
    branches: [main, master]

# Push liên tiếp vào cùng một nhánh thì huỷ lượt chạy cũ — không có dòng này,
# 5 lần push nhanh sẽ chiếm runner cho 5 lượt build đã lỗi thời.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    name: Lint, build, unit test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cài đặt dependency
        run: npm ci

      - name: Lint
        # `lint:check` chứ không phải `lint` — bản `lint` có --fix và sẽ sửa file.
        run: npm run lint:check

      - name: Kiểm tra định dạng
        run: npm run format:check

      - name: Build toàn bộ package
        run: npm run build

      # Các script trong `test/*.check.ts` KHÔNG nằm trong `tsconfig.json` của
      # core, nên `npm run build` không thấy chúng, và CI cũng chỉ chạy vài cái.
      # Hệ quả thật: `request()`/`accept()` bị gỡ ngày 28/09 mà bốn check script
      # vẫn gọi, hỏng âm thầm cả tuần. Bước này là lưới chặn đó.
      - name: Typecheck các script kiểm chứng
        run: npm run typecheck:checks --workspace @chantam.vn/chantam.core

      - name: Unit test
        run: npm test

      - name: Hợp đồng chạy của smoke-cli
        # Deploy nạp `smoke-cli.sh` qua stdin (`bash -s < ...`), nơi `$0` là
        # "bash" chứ không phải đường dẫn file. CI gọi nó bằng
        # `bash scripts/smoke-cli.sh` nên `$0` đúng và lỗi đó KHÔNG BAO GIỜ lộ
        # ra ở đây — 30/09 nó chỉ đổ ở bước release, sau khi mọi cổng đã xanh.
        #
        # Nằm ở `verify` chứ không phải `integration`: phép kiểm này không cần
        # database, Redis hay MinIO. Để trong `integration` thì một lượt pull
        # ảnh hỏng là nó không bao giờ chạy.
        run: bash scripts/smoke-cli.spec.sh

      - name: Bảng tra mã lỗi còn khớp mã nguồn
        # docs/API-ERRORS.md sinh từ danh mục lỗi. Thêm lỗi mà quên chạy lại
        # `npm run docs:errors` thì bảng tra của bên mobile nói sai — chặn ở đây.
        run: npm run docs:errors:check

      - name: Xác nhận build không làm bẩn working tree
        # Nếu bước nào đó lén sửa file đã commit, phát hiện ở đây chứ không phải
        # lúc lập trình viên thấy diff lạ trên máy mình.
        run: git diff --exit-code

  # ───────────────────────────────────────────────────────────────────────────
  integration:
    name: Kiểm thử tích hợp (PostGIS thật)
    runs-on: ubuntu-latest
    # 60 chứ không 40: bước "mọi script kiểm chứng" nay chạy **43** script tuần tự,
    # không phải 30 như ghi chú trước. Tuần tự là bắt buộc — nhiều script dựng
    # database nháp riêng rồi drop, chạy song song là đạp lên nhau.
    #
    # Đo 04/10 tại máy: mỗi script mất ~19 giây, phần lớn là chạy lại toàn bộ hơn
    # 100 migration để dựng database nháp. 43 × 19s ≈ 14 phút tại máy, và runner CI
    # chậm hơn đáng kể — cộng các bước còn lại của job (migration, seed demo, khởi
    # động service, chat e2e, smoke) thì 40 phút là mép quá sát.
    #
    # Con số này CHƯA TỪNG được đo trên CI: job luôn chết ở bước `smoke-cli` trước
    # khi tới bước nặng, nên 40 phút chưa bao giờ bị thử thật. Nới trước thay vì
    # chờ một lượt timeout để biết — thà job dài hơn còn hơn bỏ lớp kiểm chứng duy
    # nhất thấy được những lỗi mà unit test mock `query` không thể thấy.
    timeout-minutes: 60

    services:
      postgres:
        # Image này tự tạo extension postgis trong POSTGRES_DB lúc initdb.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: chantam
          POSTGRES_PASSWORD: chantam
          POSTGRES_DB: chantam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chantam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # `development` nên service KHÔNG tự chạy migration lúc khởi động — bước
      # `migration:run` ở dưới lo việc đó, để lỗi migration lộ ra ngay tại bước
      # của nó thay vì lẫn vào log khởi động.
      NODE_ENV: development
      # `debug` chứ không `info`: smoke test đọc OTP xác minh SĐT từ log service,
      # mà `ConfiguredOtpSender` ghi mã ở mức `debug`. Ở mức `info` thì chặng
      # F56 không chạy được, và mọi phép thử vòng đời bài đăng phía sau ăn 403
      # "Cần hoàn tất onboarding trước khi đăng bài".
      LOG_LEVEL: debug
      PORT: '3000'
      DATABASE_URI: postgres://chantam:chantam@localhost:5432/chantam
      REDIS_URI: redis://localhost:6379
      JWT_SECRET: khoa-chi-dung-trong-ci-khong-phai-bi-mat-that-0123456789
      POST_OPERATOR_USERNAMES: demo-kiem-duyet
      # Trần đăng ký theo IP có mặc định là 5/giờ, và nó đúng cho production:
      # thứ cần chặn là một IP tạo hàng loạt tài khoản. Nhưng CI chạy MỌI thứ
      # từ một IP duy nhất — chat-e2e tạo 3 tài khoản rồi smoke test tạo thêm 3,
      # nên tài khoản thứ 6 sẽ ăn 429 và cả phần hồ sơ/đăng bài của smoke đổ
      # theo. Nới ở đây chứ không sửa mặc định: ngoài CI thì con số 5 vẫn đúng.
      MAX_REGISTRATIONS_PER_IP: '50'
      STORAGE_ENDPOINT: http://localhost:19000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: chantam-media
      STORAGE_ACCESS_KEY_ID: chantam-minio
      STORAGE_SECRET_ACCESS_KEY: chantam-minio-secret
      STORAGE_PUBLIC_BASE_URL: http://localhost:19000/chantam-media

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cài đặt dependency
        run: npm ci

      - name: Build
        run: npm run build

      - name: Khởi động MinIO (object storage)
        run: |
          docker compose up -d minio
          docker compose up minio-init

      - name: Chạy migration
        # Cố ý KHÔNG tạo extension bằng tay ở đây: migration đầu tiên phải tự
        # tạo được postgis/unaccent/pg_trgm. Bỏ bước thủ công đi chính là phép
        # kiểm chứng migration đủ sức dựng schema trên database trắng.
        working-directory: suites/chantam.vn/chantam/core
        run: npm run migration:run

      - name: Xác nhận schema do migration dựng
        env:
          PGPASSWORD: chantam
        run: |
          psql -h localhost -U chantam -d chantam -tAc "SELECT postgis_version();"
          test "$(psql -h localhost -U chantam -d chantam -tAc 'SELECT count(*) FROM migrations;')" -gt 0

      - name: Kiểm chứng backfill M2.1 với dữ liệu thật
        # Bước trên chạy migration trên database TRẮNG, nên câu backfill
        # `INSERT INTO posts ... FROM gift_posts` chèn đúng 0 dòng — xanh mà
        # không chứng minh được gì. Script này dựng một database nháp riêng,
        # chạy migration làm hai pha và seed bài đăng cũ vào giữa, để backfill
        # thật sự gặp dữ liệu. Nếu không có bước này thì lần chạy thật đầu tiên
        # sẽ là lúc nâng cấp production.
        working-directory: suites/chantam.vn/chantam/core
        run: npm run migration:backfill-check

      - name: Kiểm mọi khoá cấu hình đều có chỗ cho Admin sửa
        # Mọi `normalize*` lùi về mặc định khi thiếu dòng, nên một khoá chưa seed
        # KHÔNG làm gì đổ — nó chỉ lặng lẽ khiến Admin không có ô nào để sửa, và
        # tính năng "cấu hình động" thành ra phải deploy mới đổi được.
        #
        # Ngày 29/09 soát ra năm khoá như vậy, một trong số đó tệ hơn hẳn:
        # `moderation.blocked_terms` rỗng làm `screenText` trả ALLOW cho MỌI nội
        # dung, tức cả nhánh kiểm duyệt bình luận nằm im. Không unit test nào bắt
        # được vì tất cả đều truyền danh sách từ vào trực tiếp.
        working-directory: suites/chantam.vn/chantam/core
        run: npm run test:config-inventory

      - name: Chạy THẬT mọi CLI một lượt
        # Bốn spec CLI hiện có đều TIÊM một `createApplicationContext` giả, mà đúng
        # hai cái bẫy từng làm cả bảy CLI chết lại nằm chính ở chỗ bị tiêm: tham số
        # mặc định `.bind(NestFactory)`, và việc `@Global()` chỉ có hiệu lực SAU KHI
        # được import ở đâu đó. Cả hai chỉ hiện khi tiến trình khởi động thật.
        #
        # Bước này bắt được ngay lần chạy đầu: `post:expire` chết vì `PostModule`
        # thiếu `GiftRequestModule`, và nó đang nằm trong crontab — tức bài quá hạn
        # KHÔNG được đóng suốt từ lúc `CloseOpenRequestsService` ra đời.
        run: bash scripts/smoke-cli.sh

      - name: Kiểm ba chế độ policy của /docs
        # `/docs` ẩn ở production, sau Basic Auth ở staging, mở ở local — ba nhánh
        # đó quyết định liệu toàn bộ bản đồ API có nằm công khai hay không, nên chúng
        # phải được kiểm ở mọi lượt đẩy. Phép kiểm chạy bằng curl giả nên không cần
        # dịch vụ sống.
        #
        # 30/09 nó đỏ tại HEAD và không ai biết, vì nó chưa từng được nối vào đây — và nó
        # đỏ vì danh sách route chép tay trong mock của chính nó đã cũ 19 route.
        run: bash scripts/smoke-docs-policy.spec.sh


      - name: Kiểm hợp đồng UPDATE ... RETURNING
        # `query()` bọc kết quả UPDATE/DELETE thành [rows, affected] nhưng
        # INSERT/SELECT thì không. Unit test mock `query` nên xanh cả khi đọc
        # sai — 463 test từng xanh trong lúc duyệt giao dịch không phát hiện
        # hết hàng và ghi nhận giới thiệu luôn báo chưa đủ điều kiện.
        working-directory: suites/chantam.vn/chantam/core
        run: npm run test:returning

      - name: Kiểm chứng vòng đời bài đăng trên database thật
        # Unit test của hai use case vòng đời mock cả repository, nên không câu
        # SQL nào được chạy. Bước này bắt được đúng loại lỗi mà chúng bỏ sót:
        # lần chạy đầu tiên đã lộ một phép so enum với text[] và một chỗ đọc
        # sai kết quả `UPDATE ... RETURNING`.
        working-directory: suites/chantam.vn/chantam/core
        run: npm run test:lifecycle

      - name: Kiểm chứng duyệt yêu cầu khi có tranh chấp
        # CI chạy tuần tự nên hai lượt duyệt không bao giờ gặp nhau; script này
        # ép chúng chạy song song trên các kết nối riêng để khoá thật sự tranh
        # nhau. Lần đầu chạy nó tìm ra 24/25 vòng bị deadlock.
        working-directory: suites/chantam.vn/chantam/core
        run: npm run test:concurrency

      - name: Mọi script kiểm chứng trên Postgres thật
        # 25 trong 30 script `test/*.check.ts` trước 30/09 chỉ chạy khi có người gõ
        # tay, dù chúng là lớp duy nhất bắt được những lỗi mà unit test mock
        # `query` không thể thấy. Nay là 43 script, và danh sách tự lấy từ
        # `package.json` nên thêm một script mới là nó tự vào — KHÔNG phải sửa file
        # này. Đó là chủ ý: một danh sách chép tay ở đây sẽ mục đúng như ghi chú
        # "30 script" đã mục.
        #
        # Bước này bắt được ngay hai cái ở lượt đầu, và cả hai do migration
        # `1795700000000` seed thêm `chat.retention` + `rank.points_source` gây ra:
        #
        #   - `chat-purge` nổ `UQ_system_configs_key_version` vì nó ghi cứng
        #     version 1 — hỏng ỒN ÀO.
        #   - `redemption` dùng `ON CONFLICT DO NOTHING` nên lượt ghi bị bỏ qua
        #     LẶNG LẼ: cấu hình vẫn là BALANCE, và phép kiểm "nguồn LIFETIME thì
        #     không cảnh báo tụt hạng" đo một thứ nó tưởng đã đặt. Kiểu này tệ hơn.
        #
        # Cả hai lọt qua nhiều commit. Sửa bằng `test/publish-config-version.ts`.
        #
        # Chạy TUẦN TỰ và `--no-bail` kiểu thủ công: nhiều script dựng database
        # nháp riêng rồi drop, nên chạy song song là chúng đạp lên nhau. Vòng lặp
        # thu hết lỗi để một lượt CI báo mọi script hỏng, không chỉ script đầu tiên.
        working-directory: suites/chantam.vn/chantam/core
        run: |
          SCRIPTS=$(node -e "
            const p = require('./package.json');
            const skip = new Set([
              'test:cov', 'test:watch',
              // Đã chạy ở bước riêng phía trên, có chú thích lý do ở đó.
              'test:config-inventory', 'test:returning', 'test:lifecycle',
              'test:concurrency',
              // Cần service HTTP + WebSocket đang chạy — chạy sau khi service lên.
              'test:chat-e2e',
            ]);
            console.log(
              Object.keys(p.scripts)
                .filter((k) => k.startsWith('test:') && !skip.has(k))
                .join(' '),
            );
          ")
          failed=''
          for s in $SCRIPTS; do
            echo "::group::$s"
            if npm run "$s"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$s thất bại"
              failed="$failed $s"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Script kiểm chứng thất bại:$failed"
            exit 1
          fi

      - name: Kiểm đường cảnh báo cron
        # Một hệ báo động chưa ai thử là một hệ báo động không biết mình có chạy
        # hay không, và đó là kiểu hỏng tệ nhất — khi cần tới nó thì đã muộn.
        # Script dựng một webhook cục bộ và kiểm: hai hình payload (webhook và
        # Telegram), cắt tin quá trần, hai bộ đóng gói JSON, và các nhánh thất bại.
        env:
          # Runner ubuntu-latest có jq sẵn. Đặt biến này để thiếu jq là ĐỎ, chứ
          # không phải một dòng "BỎ QUA" lặng im giữa vài nghìn dòng log.
          CHANTAM_ALERT_REQUIRE_JQ: '1'
        run: bash scripts/test-cron-alert.sh

      - name: Khởi tạo dữ liệu demo
        working-directory: suites/chantam.vn/chantam/core
        run: npm run seed:demo:built

      - name: Khởi động service
        working-directory: suites/chantam.vn/chantam/core
        run: |
          node dist/main.js > "$RUNNER_TEMP/core.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/core.pid"

      - name: Chờ service sẵn sàng
        run: |
          for i in $(seq 1 30); do
            if curl -sf -m 5 http://localhost:3000/health > /dev/null; then
              echo "Service sẵn sàng sau $((i * 2)) giây"
              exit 0
            fi
            sleep 2
          done
          echo "Service không lên sau 60 giây"
          exit 1

      - name: Kiểm chat end-to-end trên service thật
        # PHẢI sau khi service sẵn sàng: bước này gọi HTTP và mở WebSocket thật.
        #
        # Gateway Socket.io không có test nào dựng nổi — unit test mock
        # repository, và không spec nào dựng DI container cùng gateway. Lần chạy
        # đầu nó đã bắt được một tham số SQL không dùng và một 400 do Fastify từ
        # chối body rỗng; cả hai đều xanh trong 473 unit test.
        working-directory: suites/chantam.vn/chantam/core
        run: npm run test:chat-e2e

      - name: Smoke test đầy đủ
        # Đây là chỗ duy nhất chuỗi ST_DWithin -> repository -> use case ->
        # controller được kiểm tự động. Unit test mock repository nên không
        # chạm tới PostGIS.
        #
        # `CORE_LOG` là đường lấy OTP xác minh SĐT: ở môi trường không phải
        # production, mã được ghi ra log thay vì gửi SMS. Không có nó thì smoke
        # dừng ở cổng onboarding.
        env:
          CORE_LOG: ${{ runner.temp }}/core.log
        run: bash scripts/smoke-test.sh http://localhost:3000

      - name: In log service khi thất bại
        if: failure()
        run: cat "$RUNNER_TEMP/core.log" || true

  # ───────────────────────────────────────────────────────────────────────────
  docker:
    name: Dockerfile và image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: chantam
          POSTGRES_PASSWORD: chantam
          POSTGRES_DB: chantam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chantam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Kiểm cấu hình Nginx bằng nginx -t thật
        # Phép kiểm văn bản `nginx-ratelimit-guard.spec.ts` canh quan hệ ngưỡng và
        # tên zone, nhưng nó KHÔNG biết Nginx có khởi động được không. Một dấu `}`
        # thiếu hay một directive sai ngữ cảnh chỉ `nginx -t` thấy — và trên host
        # đang chạy, reload thất bại nghĩa là cấu hình CŨ vẫn phục vụ, nên người ta
        # tưởng đã áp dụng xong.
        #
        # Đặt ở job này vì nó đã có Docker sẵn.
        run: bash scripts/test-nginx-config.sh

      - name: Kiểm tra Dockerfile không lệch với cây dependency
        # Thêm một dependency `file:` mà quên chạy `npm run docker:generate` thì
        # image thiếu package — lỗi chỉ lộ ra lúc deploy. Bộ sinh chỉ dùng
        # builtin của Node nên không cần npm ci.
        working-directory: suites/chantam.vn/chantam/core
        run: |
          node ../../../../bin/make-dockerfile.mjs > Dockerfile
          if ! git diff --exit-code -- Dockerfile; then
            echo "::error::Dockerfile lệch với cây dependency. Chạy 'npm run docker:generate' trong suites/chantam.vn/chantam/core rồi commit lại."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: suites/chantam.vn/chantam/core/Dockerfile
          push: false
          load: true
          tags: chantam/core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Chạy thử image
        # Image chạy ở NODE_ENV=production nên nó TỰ chạy migration lúc khởi
        # động — đây đồng thời là phép kiểm đường triển khai thật.
        #
        # Build thành công không chứng minh image chạy được. Ví dụ có thật:
        # `npm start` từng gọi cross-env — một devDependency bị `npm prune
        # --omit=dev` xoá mất — nên container chết ngay khi khởi động.
        run: |
          docker run -d --name core-ci --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URI=postgres://chantam:chantam@localhost:5432/chantam \
            -e REDIS_URI=redis://localhost:6379 \
            -e JWT_SECRET=khoa-chi-dung-trong-ci-khong-phai-bi-mat-that-0123456789 \
            chantam/core:ci

          for _ in $(seq 1 30); do
            if curl -sf -m 5 http://localhost:3000/health > /dev/null; then
              echo "Image chạy được"
              exit 0
            fi
            sleep 2
          done
          echo "Image không phục vụ được /health sau 60 giây"
          exit 1

      - name: Smoke test chỉ đọc trên image
        run: bash scripts/smoke-test.sh http://localhost:3000 --read-only

      - name: In log container khi thất bại
        if: failure()
        run: docker logs core-ci || true

      - name: Dọn dẹp
        if: always()
        run: docker rm -f core-ci || true
