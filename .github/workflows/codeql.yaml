name: CodeQL

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    # Thứ Hai 06:17 UTC (13:17 giờ Việt Nam). Tránh phút :00 vì cả thế giới
    # đặt lịch ở đó, hàng đợi của GitHub bị dồn.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Phân tích mã nguồn
    # Code scanning cần GitHub Advanced Security, mà GHAS chỉ miễn phí cho repo
    # public. Repo này đang private và chưa bật GHAS, nên job chạy là chắc chắn
    # đỏ với "Advanced Security must be enabled for this repository" — không
    # liên quan gì tới mã nguồn.
    #
    # Để nó đỏ mãi còn hại hơn là tắt: người ta quen nhìn CI đỏ rồi bỏ qua, và
    # lần CI đỏ thật sẽ không ai để ý.
    #
    # Bật lại: Settings > Code security > bật Advanced Security (hoặc chuyển
    # repo sang public), rồi đặt biến repository CODE_SCANNING_ENABLED = true
    # (Settings > Secrets and variables > Actions > Variables).
    # Cùng cơ chế với DEPLOY_ENABLED của workflow deploy.
    if: vars.CODE_SCANNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # Không build: TypeScript được CodeQL phân tích trực tiếp từ source.
      # Thêm bước build chỉ làm chậm mà không tăng độ phủ.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
