version: 2

updates:
  # npm workspaces: Dependabot đọc từ thư mục gốc và tự hiểu toàn bộ package
  # trong workspace, không cần khai từng package một.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    # Gom nhóm để không ngập PR. Không gom thì mỗi tuần có ~15 PR lẻ và team
    # sẽ ngừng đọc chúng — tệ hơn là không có Dependabot.
    #
    # `update-types: [minor, patch]` ở MỌI nhóm là bắt buộc. Thiếu nó thì một
    # bản major lọt vào giữa nhóm và kéo cả PR xuống đỏ: PR gộp 9 gói @nestjs/*
    # lên v12 làm vỡ build, trong khi 8 gói kia chỉ là bản vá vô hại. Tách ra
    # thì phần an toàn merge được ngay, phần rủi ro đứng riêng để người quyết.
    groups:
      nestjs:
        patterns: ['@nestjs/*']
        update-types: [minor, patch]
      typeorm-postgres:
        patterns: ['typeorm', 'pg', '@nestjs/typeorm']
        update-types: [minor, patch]
      fastify:
        patterns: ['fastify', '@fastify/*']
        update-types: [minor, patch]
      testing:
        patterns: ['jest', 'ts-jest', '@types/jest', 'supertest', '@types/supertest']
        update-types: [minor, patch]
      linting:
        patterns: ['eslint*', 'prettier*', 'typescript-eslint', '@eslint/*', 'globals']
        update-types: [minor, patch]
      types:
        patterns: ['@types/*']
        exclude-patterns: ['@types/jest', '@types/supertest']
        update-types: [minor, patch]
    ignore:
      # Nâng major của những thứ này luôn kéo theo thay đổi kiến trúc — làm có
      # chủ đích, không để Dependabot mở PR tự động.
      #
      # `@nestjs/*` chứ không chỉ `@nestjs/core`: NestJS 12 đổi kiểu của
      # @nestjs/config (bỏ `abortEarly`) và của platform-fastify, nên nâng lẻ
      # một gói trong bộ là vỡ build ngay.
      #
      # ĐÁNH ĐỔI: Dependabot security update cũng tuân theo `ignore`, nên lỗ
      # hổng nào chỉ vá được bằng major sẽ KHÔNG tự mở PR. Lưới đỡ là job
      # `npm audit` chạy hằng tuần — nó vẫn báo, chỉ là người phải tự nâng.
      - dependency-name: '@nestjs/*'
        update-types: [version-update:semver-major]
      - dependency-name: typeorm
        update-types: [version-update:semver-major]
      - dependency-name: pg
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'

  # Image nền của chính service. Không có mục này thì `node:22-slim` đứng yên
  # mãi mãi: `npm audit` chỉ soi gói npm, không thấy CVE của tầng hệ điều hành
  # bên dưới — mà đó mới là thứ chạy toàn bộ API.
  - package-ecosystem: docker
    directory: /suites/chantam.vn/chantam/core
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    groups:
      base-image:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Nâng major Node là quyết định có chủ đích, không để tự mở PR.
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'chore(docker)'

  # Postgres và Redis trên server. Chúng TỰ CHẠY nhưng KHÔNG tự cập nhật: phiên
  # bản ghim trong compose, còn bước deploy chỉ `pull core`. Không có mục này
  # thì không gì báo khi có CVE trong chính database.
  #
  # Lưu ý: hệ sinh thái docker-compose chỉ hỗ trợ version update, KHÔNG hỗ trợ
  # security update — nên PR đến theo lịch tuần chứ không đến ngay khi có CVE.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy
      - /suites/chantam.vn/chantam/core
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    groups:
      infra-images:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Nâng major Postgres phải làm tay: đổi phiên bản là phải dump/restore,
      # volume dữ liệu của bản cũ không mount thẳng sang bản mới được.
      - dependency-name: postgis/postgis
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'chore(docker)'
