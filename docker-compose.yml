# Hạ tầng phụ trợ cho môi trường phát triển của Chân Tâm.
# Dùng: docker compose up -d
services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: chantam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chantam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chantam}
      POSTGRES_DB: ${POSTGRES_DB:-chantam}
    ports:
      - '${POSTGRES_PORT:-15432}:5432'
    volumes:
      - chantam-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-chantam}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chantam-net

  redis:
    image: redis:7-alpine
    container_name: chantam-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-16379}:6379'
    volumes:
      - chantam-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chantam-net


  # MinIO RELEASE.2025-10-15T17-29-55Z, ghim theo DIGEST chứ không theo tag.
  #
  # `quay.io/minio/minio` đã bị chuyển sang riêng tư (24/09): pull ẩn danh trả
  # 401 cho MỌI tag và cả digest, và `docker.io/minio/minio` thì bị xoá hẳn. Máy
  # nào còn ảnh trong cache vẫn chạy, nên lỗi chỉ lộ ra ở runner CI sạch.
  #
  # `quay.io/minio/aistor/minio` mà tài liệu chỉ sang KHÔNG thay được ở đây: nó
  # kéo được, container sống, `/minio/health/live` trả 200 — nhưng mọi thao tác
  # S3 trả `AccessDenied — No license is installed`. Đổi sang nó thì CI qua được
  # bước kéo ảnh rồi chết ở smoke test, khó truy hơn hẳn hiện tại.
  #
  # Nay là mirror của CHÍNH repo này (29/09), sao bằng `mirror-images.yaml`.
  #
  # Ghim digest một mình không cứu được chuyện đã xảy ra với MinIO: khi cả kho bị
  # khoá thì digest cũng 401. Thứ duy nhất cứu được là giữ một bản sao ở nơi mình
  # kiểm soát — nên trước đó, dù đã ghim digest, CI vẫn phụ thuộc vào việc
  # `coollabsio` có tiếp tục mở kho hay không.
  #
  # Ảnh đã được workflow kiểm THẬT trước khi đẩy: dựng container, tạo bucket,
  # `mc ls`. Sao một ảnh hỏng về kho của mình thì chỉ đổi chỗ lỗi.
  #
  # Đổi phiên bản thì chạy lại `mirror-images.yaml` rồi ghim digest MỚI nó in ra,
  # đừng sửa tay chuỗi dưới đây.
  minio:
    image: ghcr.io/fdshn/trueheart-minio@sha256:c737b782e5600ae90f95954b88364379734adb868f89e9c09370f80e4afbbd26
    container_name: chantam-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chantam-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chantam-minio-secret}
    ports:
      - '${MINIO_PORT:-19000}:9000'
      - '${MINIO_CONSOLE_PORT:-19001}:9001'
    volumes:
      - chantam-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chantam-net


  # Dùng LẠI ảnh minio thay vì kéo thêm ảnh `mc` riêng: `mc` nằm sẵn trong đó ở
  # `/usr/bin/mc` — chính là thứ healthcheck `mc ready local` ở trên đang gọi.
  # Một ảnh ít đi là một kho ít đi có thể bị khoá.
  minio-init:
    image: ghcr.io/fdshn/trueheart-minio@sha256:c737b782e5600ae90f95954b88364379734adb868f89e9c09370f80e4afbbd26
    depends_on:
      minio: { condition: service_healthy }
    restart: 'no'
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      mc anonymous set download local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chantam-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chantam-minio-secret}
      MINIO_BUCKET: ${STORAGE_BUCKET:-chantam-media}
    networks:
      - chantam-net

volumes:
  chantam-postgres-data:
  chantam-redis-data:
  chantam-minio-data:

networks:
  chantam-net:
    name: chantam-net
