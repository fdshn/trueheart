# Hạ tầng phụ trợ cho môi trường phát triển của Chân Tâm.
# Dùng: docker compose up -d
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: chantam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chantam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chantam}
      POSTGRES_DB: ${POSTGRES_DB:-chantam}
    ports:
      - '${POSTGRES_PORT:-15432}:5432'
    volumes:
      - chantam-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-chantam}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chantam-net

  redis:
    image: redis:7-alpine
    container_name: chantam-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-16379}:6379'
    volumes:
      - chantam-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chantam-net


  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: chantam-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chantam-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chantam-minio-secret}
    ports:
      - '${MINIO_PORT:-19000}:9000'
      - '${MINIO_CONSOLE_PORT:-19001}:9001'
    volumes:
      - chantam-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chantam-net


  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    restart: 'no'
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      mc anonymous set download local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chantam-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chantam-minio-secret}
      MINIO_BUCKET: ${STORAGE_BUCKET:-chantam-media}
    networks:
      - chantam-net

volumes:
  chantam-postgres-data:
  chantam-redis-data:
  chantam-minio-data:

networks:
  chantam-net:
    name: chantam-net
