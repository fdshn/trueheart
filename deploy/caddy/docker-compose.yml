# Reverse proxy dùng chung cho mọi môi trường trên máy này.
#
# Dựng riêng khỏi stack ứng dụng vì nó thuộc về MÁY, không thuộc về môi trường:
# deploy lại staging không được làm gián đoạn production, mà chúng dùng chung
# cổng 80/443.
#
# Dùng: cd /home/deploy/caddy && docker compose up -d

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped

    # Chạy thẳng trên mạng của máy chủ. Hai lý do:
    #   1. Với được tới 127.0.0.1:3000 và :3001 mà các stack đang bind — nếu
    #      không thì staging và production phải nối chung một network Docker,
    #      tức là container của hai môi trường nhìn thấy nhau.
    #   2. Caddy thấy IP thật của client, không phải IP gateway của Docker —
    #      cần cho rate limit và cho log có ý nghĩa.
    network_mode: host

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Chứng chỉ Let's Encrypt nằm ở /data. MẤT volume này là mất chứng chỉ,
      # và Let's Encrypt giới hạn 5 lần cấp lại mỗi tuần cho cùng một tên miền.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy

    env_file: .env

    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
