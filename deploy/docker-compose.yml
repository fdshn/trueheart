# Cấu hình chạy trên VPS. Không dùng cho môi trường phát triển —
# docker-compose.yml ở gốc monorepo mới là bản cho máy lập trình viên.
#
# Workflow deploy ghi biến IMAGE vào .env rồi chạy:
#   docker compose pull core && docker compose up -d --wait
# Cố ý KHÔNG đặt `container_name`: tên container là duy nhất trên toàn máy, nên
# đặt cứng thì hai môi trường (staging + production) không cùng tồn tại được.
# Compose tự đặt tên theo project, mà project lấy theo tên thư mục —
# /home/deploy/chantam-staging và .../chantam-production tách nhau sạch, kể cả
# volume lẫn network.

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?bắt buộc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?bắt buộc}
      POSTGRES_DB: ${POSTGRES_DB:?bắt buộc}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # KHÔNG publish database ra Internet. Cổng này chỉ nghe loopback của VPS để
    # DBeaver/DataGrip đi qua SSH tunnel: local client → SSH deploy@VPS →
    # 127.0.0.1:15432 → postgres container:5432.
    #
    # 15432 cố ý khác 5433 (database EduStack đang có trên VPS) và khác cổng
    # public; firewall không cần mở thêm gì.
    ports:
      - '127.0.0.1:15432:5432'
    networks: [chantam]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [chantam]

  core:
    image: ${IMAGE:?workflow deploy phải ghi biến này vào .env}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?bắt buộc, tối thiểu 32 ký tự}
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URI: redis://redis:6379
      GEO_JITTER_RADIUS_METERS: ${GEO_JITTER_RADIUS_METERS:-300}

      # Hạn OTP và ô "Servers" của Swagger. Hai dòng này TỪNG có trong
      # `.env.example` mà KHÔNG được truyền vào đây, nên đặt chúng không có tác
      # dụng gì — `bootstrap.sh` ghi `API_SERVERS` vào .env rồi Swagger vẫn chỉ
      # thấy localhost. Một file mẫu bảo người ta đặt một biến vô hiệu còn tệ hơn
      # không khai nó.
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      API_SERVERS: ${API_SERVERS:-}

      # BẮT BUỘC `true` ở mọi môi trường có host Nginx đứng trước, tức staging và
      # production. Để `false` ở đó thì mọi request mang IP của proxy, nên BỐN cái
      # trần theo IP dưới đây dồn hết vào một xô: một người lụt là cả hệ bị 429.
      #
      # Trước bản này biến KHÔNG được truyền vào container, nên không có cách nào
      # bật nó trên server — bốn cái trần kia chạy ở trạng thái vô nghĩa.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      GLOBAL_RATE_LIMIT_PER_MINUTE: ${GLOBAL_RATE_LIMIT_PER_MINUTE:-600}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-900}
      MAX_LOGIN_ATTEMPTS_PER_IP: ${MAX_LOGIN_ATTEMPTS_PER_IP:-30}
      MAX_REGISTRATIONS_PER_IP: ${MAX_REGISTRATIONS_PER_IP:-5}
      REGISTRATION_WINDOW_SECONDS: ${REGISTRATION_WINDOW_SECONDS:-3600}

      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}

      # Gốc web công khai cho link chia sẻ hồ sơ. Thiếu thì API trả `shareUrl`
      # null — trên production đó là một tính năng im lặng không hoạt động.
      WEB_PUBLIC_BASE_URL: ${WEB_PUBLIC_BASE_URL:-}

      # Cần để cấp SUPER_ADMIN đầu tiên trên một môi trường mới. Không truyền vào
      # thì không có đường nào tạo admin đầu tiên ngoài sửa database bằng tay.
      ADMIN_BOOTSTRAP_USERNAMES: ${ADMIN_BOOTSTRAP_USERNAMES:-}

      # From identity cho EmailOtpSender tương lai. Không tự bật delivery.
      OTP_EMAIL_FROM_ADDRESS: ${OTP_EMAIL_FROM_ADDRESS:-}
      OTP_EMAIL_FROM_NAME: ${OTP_EMAIL_FROM_NAME:-Chân Tâm}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}

      # Khoá băm số điện thoại. Bỏ trống thì vẫn băm nhưng không có khoá, và
      # chống trùng vẫn chạy — nên nó hỏng hoàn toàn im lặng.
      PHONE_HASH_PEPPER: ${PHONE_HASH_PEPPER:-}

      # Push FCM (F44). Trống thì fail-closed, không giả vờ đã gửi.
      FCM_SERVICE_ACCOUNT_BASE64: ${FCM_SERVICE_ACCOUNT_BASE64:-}
      # R2/S3 credential chỉ tồn tại trong .env server/environment secret, không
      # commit. Thiếu config thì Storage endpoint fail closed, Core vẫn healthy.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
    ports:
      # Chỉ bind loopback. Host Nginx đứng trước lo TLS và không phơi thẳng
      # Node ra Internet.
      - '127.0.0.1:${CORE_PORT:-3000}:3000'
    healthcheck:
      # Dùng fetch của Node chứ không dùng curl: image node:22-slim không có
      # curl, và `docker compose up --wait` phụ thuộc chính healthcheck này.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      # Giá trị này lấy TỪ HOST staging, không phải từ repo.
      #
      # Repo đặt 5s/60s hôm 18/09 (`06e7265`). Host được nới thành 15s/40s hôm
      # 23/09 — mới hơn, nên đó là tuỳ biến có chủ ý của người vận hành. Đo được
      # 05/10 khi so compose trên host với repo.
      #
      # Ghi lại ở đây để lượt deploy sau KHÔNG xoá nó: một file trong repo nói
      # khác thực tế trên host là cách tuỳ biến bị mất mà không ai thấy. VPS này
      # chạy cả EduStack, nên hạ interval về 5s là tăng gấp ba số lượt healthcheck.
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
    networks: [chantam]

volumes:
  postgres-data:
  redis-data:

networks:
  # KHÔNG đặt `name:` cố định. Đặt cứng thì staging và production cùng gắn vào
  # một network, mà cả hai đều có service tên `postgres` — DNS của Docker sẽ trả
  # về một trong hai không xác định, và `postgres://...@postgres:5432` của
  # staging có thể trỏ thẳng vào database production.
  #
  # Để trống thì Compose tự thêm tiền tố tên project: chantam-staging_chantam và
  # chantam-production_chantam, tách bạch hoàn toàn.
  chantam:
