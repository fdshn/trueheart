# Cấu hình chạy trên VPS. Không dùng cho môi trường phát triển —
# docker-compose.yml ở gốc monorepo mới là bản cho máy lập trình viên.
#
# Workflow deploy ghi biến IMAGE vào .env rồi chạy:
#   docker compose pull core && docker compose up -d --wait
# Cố ý KHÔNG đặt `container_name`: tên container là duy nhất trên toàn máy, nên
# đặt cứng thì hai môi trường (staging + production) không cùng tồn tại được.
# Compose tự đặt tên theo project, mà project lấy theo tên thư mục —
# /home/deploy/chantam-staging và .../chantam-production tách nhau sạch, kể cả
# volume lẫn network.

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?bắt buộc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?bắt buộc}
      POSTGRES_DB: ${POSTGRES_DB:?bắt buộc}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # KHÔNG publish database ra Internet. Cổng này chỉ nghe loopback của VPS để
    # DBeaver/DataGrip đi qua SSH tunnel: local client → SSH deploy@VPS →
    # 127.0.0.1:15432 → postgres container:5432.
    #
    # 15432 cố ý khác 5433 (database EduStack đang có trên VPS) và khác cổng
    # public; firewall không cần mở thêm gì.
    ports:
      - '127.0.0.1:15432:5432'
    networks: [chantam]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [chantam]

  core:
    image: ${IMAGE:?workflow deploy phải ghi biến này vào .env}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?bắt buộc, tối thiểu 32 ký tự}
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URI: redis://redis:6379
      GEO_JITTER_RADIUS_METERS: ${GEO_JITTER_RADIUS_METERS:-300}
      # From identity cho EmailOtpSender tương lai. Không tự bật delivery.
      OTP_EMAIL_FROM_ADDRESS: ${OTP_EMAIL_FROM_ADDRESS:-}
      OTP_EMAIL_FROM_NAME: ${OTP_EMAIL_FROM_NAME:-Chân Tâm}
      # R2/S3 credential chỉ tồn tại trong .env server/environment secret, không
      # commit. Thiếu config thì Storage endpoint fail closed, Core vẫn healthy.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
    ports:
      # Chỉ bind loopback. Host Nginx đứng trước lo TLS và không phơi thẳng
      # Node ra Internet.
      - '127.0.0.1:${CORE_PORT:-3000}:3000'
    healthcheck:
      # Dùng fetch của Node chứ không dùng curl: image node:22-slim không có
      # curl, và `docker compose up --wait` phụ thuộc chính healthcheck này.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
    networks: [chantam]

volumes:
  postgres-data:
  redis-data:

networks:
  # KHÔNG đặt `name:` cố định. Đặt cứng thì staging và production cùng gắn vào
  # một network, mà cả hai đều có service tên `postgres` — DNS của Docker sẽ trả
  # về một trong hai không xác định, và `postgres://...@postgres:5432` của
  # staging có thể trỏ thẳng vào database production.
  #
  # Để trống thì Compose tự thêm tiền tố tên project: chantam-staging_chantam và
  # chantam-production_chantam, tách bạch hoàn toàn.
  chantam:
